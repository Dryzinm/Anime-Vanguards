<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Formulário Anime Vanguards</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Cadastro de Jogadores</h1>

    <nav>
        <a href="index.html">Início</a>
        <a href="personagens.html">Personagens</a>
        <a href="formulario.html">Formulário</a>
    </nav>
</header>

<main>

<form>

    <label>Nome</label>
    <input type="text" required>

    <label>Nick do Jogol</label>
    <input type="text" required>

    <label>Nivel da Conta</label>
    <input type="number">

    <label>Re-Rolls</label>
    <input type="number">

    <label>Data de início</label>
    <input type="date">

    <label>Maior Raridade Obtida</label>
    <input type="text">

    <label>Joga diariamente?</label>
    <input type="radio" name="joga"> Sim
    <input type="radio" name="joga"> Não

    <br><br>

    <label>Modo favorito</label>
    <input type="checkbox"> Story
    <input type="checkbox"> Infinite
    <input type="checkbox"> Raid

    <br><br>

    <label>Personagem favorito</label>
    <select>
        <option>Gojo</option>
        <option>Naruto</option>
        <option>Luffy</option>
    </select>

    <label>Comentários</label>
    <textarea rows="5"></textarea>

    <button type="submit">Enviar</button>

</form>

</main>

</body>
</html>
